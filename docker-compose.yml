services:
  # ==========================================
  # Frontend Web Client
  # ==========================================
  frontend:
    container_name: moodle-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Dev hot reload for React (node_modules stays inside the container)
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORE_SERVICE_URL=http://backend-core:8000
      - COURSES_SERVICE_URL=http://backend-courses:8001
      - AI_SERVICE_URL=http://backend-ai:8002
      - ANALYTICS_SERVICE_URL=http://backend-analytics:8003
      # Client-side API URLs for browser access
      - NEXT_PUBLIC_CORE_API_URL=http://localhost:8000
      - NEXT_PUBLIC_COURSES_API_URL=http://localhost:8001
      - NEXT_PUBLIC_AI_API_URL=http://localhost:8002
      - REACT_APP_CORE_API_URL=http://localhost:8000
      - REACT_APP_COURSES_API_URL=http://localhost:8001
      - REACT_APP_AI_API_URL=http://localhost:8002
      - VITE_CORE_API_URL=http://localhost:8000
      - VITE_COURSES_API_URL=http://localhost:8001
      - VITE_AI_API_URL=http://localhost:8002
      - VITE_ANALYTICS_API_URL=http://localhost:8003
    depends_on:
      - backend-core
      - backend-courses
      - backend-ai
      - backend-analytics
    networks:
      - moodle-network
    restart: unless-stopped

  # ==========================================
  # Team 1: Core & User Management Microservice
  # ==========================================
  backend-core:
    container_name: moodle-backend-core
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    # Dev hot reload: code edits on the host apply instantly (no rebuild)
    volumes:
      - ./backend-core/app:/app/app
      - ./backend-core/tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - SERVICE_NAME=backend-core
      - WATCHFILES_FORCE_POLLING=true
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    networks:
      - moodle-network
    restart: unless-stopped

  # ==========================================
  # Team 2: Course Content & Assignments Microservice
  # ==========================================
  backend-courses:
    container_name: moodle-backend-courses
    build:
      context: ./backend-courses
      dockerfile: Dockerfile
    # Dev hot reload: code edits on the host apply instantly (no rebuild)
    volumes:
      - ./backend-courses/app:/app/app
      - ./backend-courses/tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PORT=8001
      - SERVICE_NAME=backend-courses
      - WATCHFILES_FORCE_POLLING=true
      - CORE_SERVICE_URL=http://backend-core:8000
      - AI_SERVICE_URL=http://backend-ai:8002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - backend-core
    networks:
      - moodle-network
    restart: unless-stopped

  # ==========================================
  # Team 3: AI Smart Assistant Microservice
  # ==========================================
  backend-ai:
    container_name: moodle-backend-ai
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    # Dev hot reload: code edits on the host apply instantly (no rebuild)
    volumes:
      - ./backend-ai/app:/app/app
      - ./backend-ai/tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - PORT=8002
      - SERVICE_NAME=backend-ai
      - WATCHFILES_FORCE_POLLING=true
      - CORE_SERVICE_URL=http://backend-core:8000
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - backend-core
    networks:
      - moodle-network
    restart: unless-stopped

  # ==========================================
  # Analytics & Notifications Service
  # ==========================================
  backend-analytics:
    container_name: moodle-backend-analytics
    build:
      context: ./backend-analytics
      dockerfile: Dockerfile
    # Dev hot reload: code edits on the host apply instantly (no rebuild)
    volumes:
      - ./backend-analytics/app:/app/app
      - ./backend-analytics/tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - PORT=8003
      - SERVICE_NAME=backend-analytics
      - WATCHFILES_FORCE_POLLING=true
      - CORE_SERVICE_URL=http://backend-core:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - backend-core
    networks:
      - moodle-network
    restart: unless-stopped

# ==========================================
# Shared Internal Network
# ==========================================
networks:
  moodle-network:
    name: moodle-network
    driver: bridge
